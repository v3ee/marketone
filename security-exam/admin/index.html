<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — MarketOne Cybersecurity Awareness Assessment</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../css/exam.css" />
</head>
<body>

<div class="topbar">
  <div class="logo">
    <a href="../../index.html" class="logo-link">
      <img src="../../logo.png" alt="MarketOne" class="main-logo" />
    </a>
  </div>
</div>

<div class="exam-main">
  <div class="admin-container">

    <!-- Token gate -->
    <div class="exam-card" id="token-card" style="max-width:480px;margin:0 auto;">
      <div class="eyebrow" style="color:var(--primary);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">Restricted</div>
      <h1 style="margin-bottom:8px;">Admin access</h1>
      <p>Enter the security token to view employee results.</p>
      <form id="token-form" novalidate>
        <div class="field">
          <label for="token">Security token</label>
          <input type="password" id="token" name="token" placeholder="••••••••••••••••" autocomplete="off" required />
        </div>
        <p class="error-text" id="token-error"></p>
        <button type="submit" class="exam-btn-primary" id="access-btn">Access results</button>
      </form>
    </div>

    <!-- Dashboard -->
    <div class="hidden" id="dashboard">
      <div class="admin-header">
        <h1 style="margin:0;">Employee Results</h1>
        <div class="admin-header-actions">
          <button type="button" class="exam-btn-secondary" id="refresh-btn" style="width:auto;">
            <span class="refresh-icon">↻</span>
            Refresh
          </button>
          <button type="button" class="exam-btn-secondary" id="export-btn" style="width:auto;">
            <span>↓</span>
            Export Excel
          </button>
          <button type="button" class="exam-btn-secondary" id="logout-btn" style="width:auto;">
            Lock
          </button>
        </div>
      </div>

      <div class="admin-stats">
        <div class="stat-box"><div class="num" id="stat-employees">0</div><div class="lbl">Completed</div></div>
        <div class="stat-box"><div class="num" id="stat-average">0%</div><div class="lbl">Average score</div></div>
        <div class="stat-box"><div class="num" id="stat-risk">0</div><div class="lbl" id="stat-risk-label">Below 70%</div></div>
        <div class="stat-box"> <div class="num" id="stat-passed">0</div><div class="lbl">Passed</div></div>
      </div>

      <div style="margin-top:24px;">
        <div class="admin-toolbar">
          <input type="text" class="search-input" id="search-input" placeholder="Search by name or email..." />
          <span class="admin-result-count" id="result-count"></span>
        </div>
        <div id="employee-list"></div>
        <div class="pagination-bar hidden" id="pagination-bar">
          <div class="pagination-info" id="pagination-info"></div>
          <div style="display:flex;align-items:center;gap:12px;">
            <select class="page-size-select" id="page-size-select">
              <option value="10">10 / page</option>
              <option value="20" selected>20 / page</option>
              <option value="50">50 / page</option>
              <option value="100">100 / page</option>
            </select>
            <div class="pagination-controls" id="pagination-controls"></div>
          </div>
        </div>
      </div>

      <div class="exam-card hidden" id="no-results">
        <p style="margin:0;">No completed assessments yet.</p>
      </div>
    </div>

  </div>
</div>

<footer class="footer">
  <div class="container">
    <p>Results are protected by a server-side admin token — nothing here is publicly accessible.</p>
  </div>
</footer>

<script src="../js/api.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
